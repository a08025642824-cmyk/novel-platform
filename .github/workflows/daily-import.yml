name: Daily Novel Import

# 毎日 日本時間の朝9時（UTC 0:00）に実行
on:
  schedule:
    - cron: '0 0 * * *'
  # 手動でもボタン一つで実行できるようにする設定
  workflow_dispatch:

jobs:
  import-novels:
    runs-on: ubuntu-latest

    steps:
      # 1. コードを取得
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Node.jsの準備
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3. ライブラリのインストール
      - name: Install dependencies
        run: npm ci

      # 4. スクリプトの実行
      - name: Run import script
        run: node scripts/import_aozora.js
        env:
          # 環境変数をGitHubのSecretsから読み込む
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}